name: watch
on:
  schedule:
    - cron: "*/5 * * * *"  # best-effort; GitHub often runs scheduled jobs a few minutes late
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | test (send a test push) | debug (upload fetched pages)"
        default: normal

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "${{ inputs.mode }}" in
            test) python3 check.py --test ;;
            debug) python3 check.py --debug ;;
            *) python3 check.py ;;
          esac
      - name: Upload fetched pages
        if: inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: debug/
      - name: Save state
        if: inputs.mode != 'test'
        run: |
          git config user.name "shirt-watch"
          git config user.email "shirt-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -qm "state $(date -u +%FT%TZ)" && git push -q; }
